<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Contador de repeticiones</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="escena">
      <video id="video" playsinline muted></video>
      <canvas id="lienzo"></canvas>

      <div id="panel" hidden>
        <div class="marcador">
          <div class="campo">
            <span class="etiqueta">REPETICIONES</span>
            <strong id="contador">0</strong>
          </div>
          <div class="campo">
            <span class="etiqueta">ESTADO</span>
            <strong id="estado">-</strong>
          </div>
        </div>
        <p id="ejercicio-activo">Curl de biceps</p>
        <p id="vista">ponete de perfil</p>
        <p id="aviso" hidden></p>
      </div>

      <div id="controles" hidden>
        <button id="btn-menu" type="button">Ejercicio</button>
        <button id="btn-reiniciar" type="button">Reiniciar</button>
      </div>

      <div id="portada">
        <h1>Contador de repeticiones</h1>
        <p>
          Cuenta repeticiones de ejercicio con la cámara, usando detección de
          pose. Todo se procesa en tu dispositivo: el video no sale de acá.
        </p>
        <button id="btn-empezar" type="button">Activar cámara</button>
        <p id="estado-carga"></p>
      </div>

      <div id="menu" hidden>
        <div class="tarjeta">
          <h2>Elegir ejercicio</h2>
          <ul id="lista-ejercicios"></ul>
          <button id="btn-cerrar" type="button">Cerrar</button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
